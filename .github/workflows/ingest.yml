name: Ingest tools
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  devto:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            "${{ vars.APP_URL }}/api/ingest/devto"

  hackernews:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            "${{ vars.APP_URL }}/api/ingest/hackernews"

  github:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            "${{ vars.APP_URL }}/api/ingest/github"

  producthunt:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            "${{ vars.APP_URL }}/api/ingest/producthunt"

  process:
    needs: [devto, hackernews, github, producthunt]
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            "${{ vars.APP_URL }}/api/ingest/process"
